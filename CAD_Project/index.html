<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD_Project</title>
    <link rel="stylesheet" href="/CAD_Project/css/normalize.css">
    <link rel="stylesheet" href="/CAD_Project/css/main.css">
</head>

<body>

    <div class="cursor_dot hidden"></div>
    <div class="cursor_aura hidden"></div>

    <header class="container header">
        <div class="logo">
            <img class="logo_img" src="/CAD_Project/images/CAD.png" alt="">
            <p class="logo_text">CAD Project</p>
        </div>
        <nav class="nav_buttons">
            <ul>
                <li class="active">
                    <a class="act" href="#">Главная</a>
                </li>
                <li class="active_button">
                    <a href="#">Проекты</a>
                    <div class="under_line"></div>
                </li>
                <li class="active_button">
                    <a href="#">Услуги</a>
                    <div class="under_line"></div>
                </li>
                <li class="active_button">
                    <a href="#">Процесс</a>
                    <div class="under_line"></div>
                </li>
            </ul>
            <div class="btn">
                <a class="order_project active_button" href="#">Заказать проект</a>
            </div>
        </nav>
    </header>

    <div class="video_bg">
        <div class="videos">
            <video class="video video_current" muted>
                <source poster="/videos/poster_1.png" src="/CAD_Project/videos//video_1.mp4" type="video/mp4">
            </video>
            <video class="video video_next" muted>
                <source poster="/videos/poster_2.png" src="/CAD_Project/videos//video_2.mp4" type="video/mp4">
            </video>
        </div>
        <div class="effects">
            <div class="video_contents container">
                <div class="content content_current">
                    <h1>
                        Name video1
                    </h1>
                    <h2>Video1 description</h2>
                </div>
                <div class="content content_next">
                    <h1>
                        Name video2
                    </h1>
                    <h2>Video2 description</h2>
                </div>
            </div>
            <div class="video_buttons">
                <div class="video_button active_now">
                    <svg class="progress_ring active_ring">
                        <circle class="progress_ring_circle" cx="18" cy="18" r="14" />
                    </svg>
                </div>
                <div class="video_button">
                    <svg class="progress_ring">
                        <circle class="progress_ring_circle" cx="18" cy="18" r="14" />
                    </svg>
                </div>
                <div class="video_button">
                    <svg class="progress_ring">
                        <circle class="progress_ring_circle" cx="18" cy="18" r="14" />
                    </svg>
                </div>
                <div class="video_button">
                    <svg class="progress_ring">
                        <circle class="progress_ring_circle" cx="18" cy="18" r="14" />
                    </svg>
                </div>
                <div class="video_button">
                    <svg class="progress_ring">
                        <circle class="progress_ring_circle" cx="18" cy="18" r="14" />
                    </svg>
                </div>
                <div class="video_button">
                    <svg class="progress_ring">
                        <circle class="progress_ring_circle" cx="18" cy="18" r="14" />
                    </svg>
                </div>
                <div class="video_button">
                    <svg class="progress_ring">
                        <circle class="progress_ring_circle" cx="18" cy="18" r="14" />
                    </svg>
                </div>
            </div>
        </div>

    </div>
    <div class="container">
        <h1>ABOBA</h1>
    </div>
</body>
<script src="/CAD_Project/script.js" type="text/javascript" defer></script>

</html>
